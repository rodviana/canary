# Publica imagem no GHCR em pushes para a branch do fork (submódulo .gitmodules: rodrigo).
# Imagem: ghcr.io/<owner>/<repo>:rodrigo — definir CANARY_IMAGE na infra (ex.: infra/canary/.env).
name: Publish Docker (fork branch)

on:
  workflow_dispatch:
  push:
    branches:
      - rodrigo

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-branch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  push:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.x86
          push: true
          build-args: |
            VCPKG_FEED_URL=https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
            VCPKG_FEED_USERNAME=${{ github.repository_owner }}
            VCPKG_BINARY_SOURCES=clear;nuget,https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json,read;nugettimeout,1200
          secrets: |
            github_token=${{ secrets.VCPKG_PACKAGES_TOKEN || github.token }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
